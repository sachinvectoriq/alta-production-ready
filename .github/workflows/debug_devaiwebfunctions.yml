\```yaml
# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Python app to Azure Web App - Devaiwebfunctions

on:
  push:
    branches:
      - debug
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Linux system dependencies required by xmlsec
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libxmlsec1-dev \
            libxmlsec1-openssl \
            pkg-config

      - name: Verify Python version
        run: |
          python --version
          python -m pip --version

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          pip install -r requirements.txt

      - name: Verify xmlsec installation
        run: |
          source antenv/bin/activate
          python -c "import xmlsec; print('xmlsec installed successfully:', xmlsec.__version__)"

      # Upload application artifact
      # The antenv directory is excluded because Azure/Oryx
      # will install the application dependencies during deployment.
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Devaiwebfunctions'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2EEEFAB5FC104F78BCF52A37EA16D24A }}
```
